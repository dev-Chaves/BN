name: Build & Deploy — Benefix (Native)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: 'true'

      - name: Build Native Executable
        run: ./mvnw -B -DskipTests package -Dnative

      - name: Login no GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | \
          docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build e push da imagem
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          docker build -f src/main/docker/Dockerfile.native-micro \
            -t ${IMAGE_NAME}:${GITHUB_SHA} \
            -t ${IMAGE_NAME}:latest \
            .
          docker push ${IMAGE_NAME}:${GITHUB_SHA}
          docker push ${IMAGE_NAME}:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e
            IMAGE="${{ secrets.IMAGE_NAME }}"
            SHA="${{ github.sha }}"

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull ${IMAGE}:${SHA}

            docker stop bn-api || true
            docker rm   bn-api || true

            docker run -d \
              --name bn-api \
              --restart unless-stopped \
              --env-file /opt/bn/.env \
              -v /opt/bn/secrets:/opt/bn/secrets:ro \
              -p 127.0.0.1:8080:8080 \
              ${IMAGE}:${SHA}

            echo "Aguardando a API subir..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/q/health > /dev/null; then
                echo "API no ar!"
                break
              fi
              sleep 2
            done

            docker image prune -f