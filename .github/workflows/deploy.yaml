name: Build & Deploy — Benefix (Native)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: 'true'

      - name: Build Native Executable
        run: ./mvnw -B -DskipTests package -Dnative

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        run: |
          IMAGE=ghcr.io/dev-chaves/bn
          docker build -f src/main/docker/Dockerfile.native-micro \
            -t ${IMAGE}:${GITHUB_SHA} \
            -t ${IMAGE}:latest \
            .
          docker push ${IMAGE}:${GITHUB_SHA}
          docker push ${IMAGE}:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ec2-18-222-189-80.us-east-2.compute.amazonaws.com
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            IMAGE="ghcr.io/dev-chaves/bn"
            SHA="${{ github.sha }}"

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u "dev-chaves" --password-stdin

            docker pull ${IMAGE}:${SHA}

            test -f /opt/bn/.env || { echo "Arquivo /opt/bn/.env não encontrado"; exit 1; }
            test -f /opt/bn/secrets/publicKey.pem || { echo "Arquivo /opt/bn/secrets/publicKey.pem não encontrado"; exit 1; }
            test -f /opt/bn/secrets/privateKey.pem || { echo "Arquivo /opt/bn/secrets/privateKey.pem não encontrado"; exit 1; }

            docker stop bn-api || true
            docker rm   bn-api || true

            docker run -d \
              --name bn-api \
              --restart unless-stopped \
                --env-file /opt/bn/.env \
              -v /opt/bn/secrets:/opt/bn/secrets:ro \
              -p 127.0.0.1:8080:8080 \
              ${IMAGE}:${SHA}

            echo "Aguardando a API subir..."
            up=0
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/q/health > /dev/null; then
                echo "API no ar!"
                up=1
                break
              fi
              sleep 2
            done

            if [ "$up" -ne 1 ]; then
              echo "API não ficou saudável após 60s. Últimos logs:"
              docker logs --tail 200 bn-api || true
              exit 1
            fi

            docker image prune -f
