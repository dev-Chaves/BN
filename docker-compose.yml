services:
  app:
    build: .
    container_name: benefix-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/benefix
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=my-secret-key
    depends_on:
      - db
    networks:
      - benefix-network

  db:
    image: postgres:18-alpine
    container_name: benefix-db
    environment:
      - POSTGRES_DB=benefix
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - benefix-network

volumes:
  postgres_data:

networks:
  benefix-network:
    driver: bridge
