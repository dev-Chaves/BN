services:
  postgres:
    image: postgres:16-alpine
    container_name: bn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: benefix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d benefix" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bn_postgres_data:/var/lib/postgresql/data

volumes:
  bn_postgres_data:
