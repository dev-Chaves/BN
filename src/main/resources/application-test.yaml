quarkus:
  datasource:
    db-kind: postgresql
    username: postgres
    password: password
    jdbc:
      url: jdbc:postgresql://localhost:5432/benefix
    reactive:
      url: postgresql://localhost:5432/benefix
    devservices:
      enabled: false

  hibernate-orm:
    database:
      generation: validate
    log:
      sql: false

  flyway:
    migrate-at-start: true

  smallrye-jwt:
    enabled: true

  rate-limiter:
    buckets:
      group1:
        limits:
          - permitted-uses: 10
            period: 1S
          - permitted-uses: 100
            period: 5M
