quarkus:
  datasource:
    db-kind: postgresql
    username: postgres
    password: password
    jdbc:
      url: jdbc:postgresql://localhost:5432/benefix
    reactive:
      url: postgresql://localhost:5432/benefix
    devservices:
      enabled: false

  hibernate-orm:
    database:
      generation: validate
    log:
      sql: false

  flyway:
    migrate-at-start: true

  smallrye-jwt:
    enabled: true
