quarkus:
  datasource:
    db-kind: postgresql
    username: postgres
    password: password
    jdbc:
      url: jdbc:postgresql://localhost:5432/benefix
    reactive:
      url: postgresql://localhost:5432/benefix

  hibernate-orm:
    database:
      generation: validate
    log:
      sql: true

  flyway:
    migrate-at-start: true

  smallrye-jwt:
    enabled: true

  swagger-ui:
    always-include: true
