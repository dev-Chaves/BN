quarkus:
  datasource:
    db-kind: postgresql
    username: postgres
    password: password
    jdbc:
      url: jdbc:postgresql://localhost:5432/benefix
    reactive:
      url: postgresql://localhost:5432/benefix

  hibernate-orm:
    database:
      generation: validate
    log:
      sql: true

  flyway:
    migrate-at-start: true

  smallrye-jwt:
    enabled: true

  server:
    port: 9090

  http:
    auth:
      basic: true
      permission:
        docs:
          paths: /q/swagger-ui/*,/q/openapi*
          policy: authenticated

mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: bn-api

smallrye:
  jwt:
    sign:
      key:
        location: privateKey.pem

  swagger-ui:
    always-include: true

app:
  cookie:
    secure: false
