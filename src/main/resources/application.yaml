quarkus:
  http:
    auth:
      proactive: false
  datasource:
    db-kind: postgresql

  hibernate-orm:
    jdbc:
      timezone: UTC

  smallrye-jwt:
    enabled: true

  swagger-ui:
    always-include: true

  rate-limiter:
    buckets:
      auth-group:
        limits:
          - permitted-uses: ${AUTH_RATE_LIMIT_USES_SECOND:5}
            period: ${AUTH_RATE_LIMIT_PERIOD_SECOND:1S}
          - permitted-uses: ${AUTH_RATE_LIMIT_USES_MINUTE:30}
            period: ${AUTH_RATE_LIMIT_PERIOD_MINUTE:1M}
      onboarding-group:
        limits:
          - permitted-uses: ${ONBOARDING_RATE_LIMIT_USES_SECOND:2}
            period: ${ONBOARDING_RATE_LIMIT_PERIOD_SECOND:1S}
          - permitted-uses: ${ONBOARDING_RATE_LIMIT_USES_MINUTE:10}
            period: ${ONBOARDING_RATE_LIMIT_PERIOD_MINUTE:1M}
      redemption-group:
        limits:
          - permitted-uses: ${REDEMPTION_RATE_LIMIT_USES_SECOND:10}
            period: ${REDEMPTION_RATE_LIMIT_PERIOD_SECOND:1S}
          - permitted-uses: ${REDEMPTION_RATE_LIMIT_USES_MINUTE:120}
            period: ${REDEMPTION_RATE_LIMIT_PERIOD_MINUTE:1M}
mp:
  jwt:
    token:
      header: Cookie
      cookie: jwt
    verify:
      publickey:
        location: /opt/bn/secrets/publicKey.pem
      issuer: bn-api

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  cookie:
    secure: true
  swagger:
    auth:
      username: ${SWAGGER_BASIC_AUTH_USERNAME:}
      password: ${SWAGGER_BASIC_AUTH_PASSWORD:}


smallrye:
  jwt:
    sign:
      key:
        location: /opt/bn/secrets/privateKey.pem

"%prod":
  quarkus:
    http:
      auth:
        basic: true
        permission:
          docs:
            paths: /q/swagger-ui/*,/q/openapi*
            policy: authenticated
