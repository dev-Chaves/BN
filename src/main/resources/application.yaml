quarkus:
  datasource:
    db-kind: postgresql
  smallrye-jwt:
    enabled: true

mp:
  jwt:
    token:
      header: Cookie
      cookie: jwt
    verify:
      publickey:
        location: /opt/bn/secrets/publicKey.pem
      issuer: bn-api

app:
  cookie:
    secure: true


smallrye:
  jwt:
    sign:
      key:
        location: /opt/bn/secrets/privateKey.pem

  swagger-ui:
    always-include: true
