spring:
  application:
    name: bn-api
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/benefix}}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:${QUARKUS_DATASOURCE_USERNAME:postgres}}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${QUARKUS_DATASOURCE_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:true}
    domain: ${COOKIE_DOMAIN:.bnfix.com.br}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://bnfix.com.br,https://www.bnfix.com.br}
  jwt:
    issuer: bn-api
    expiration: PT3H
    public-key: ${JWT_PUBLIC_KEY_PATH:/opt/bn/secrets/publicKey.pem}
    private-key: ${JWT_PRIVATE_KEY_PATH:/opt/bn/secrets/privateKey.pem}
  rate-limit:
    auth:
      per-second: ${AUTH_RATE_LIMIT_USES_SECOND:5}
      per-minute: ${AUTH_RATE_LIMIT_USES_MINUTE:30}
    onboarding:
      per-second: ${ONBOARDING_RATE_LIMIT_USES_SECOND:2}
      per-minute: ${ONBOARDING_RATE_LIMIT_USES_MINUTE:10}
    redemption:
      per-second: ${REDEMPTION_RATE_LIMIT_USES_SECOND:10}
      per-minute: ${REDEMPTION_RATE_LIMIT_USES_MINUTE:120}
  swagger:
    auth:
      username: ${SWAGGER_BASIC_AUTH_USERNAME:}
      password: ${SWAGGER_BASIC_AUTH_PASSWORD:}

springdoc:
  api-docs:
    enabled: false
    path: /q/openapi
  swagger-ui:
    enabled: false
    path: /q/swagger-ui
